name: BCAM Continuous Integration

on:
  push:
    branches: [ main, fix/*, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Typecheck, Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Type Check
        run: npm run typecheck

      - name: Run Next.js Linter
        run: npm run lint

      - name: Run Vitest Unit & Integration Tests
        run: npx vitest run tests/reportingUtils.test.ts tests/reportingIntegration.test.ts tests/animatedSelect.test.ts tests/motionUtils.test.ts tests/credentialVault.test.ts tests/spreadsheetImport.test.ts tests/assetWorkflows.test.ts tests/completenessAuditor.test.ts tests/stocktakeWorkflows.test.ts tests/workbookRegister.test.ts

      - name: Run Firestore Security Rules Tests
        run: npm run test:rules

      - name: Build Next.js Production Bundle
        run: npm run build
